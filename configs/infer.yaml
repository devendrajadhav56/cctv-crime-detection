model:
  # 16-frame checkpoint; base-patch32 only accepts 8 frames.
  name: microsoft/xclip-base-patch16-16-frames
  frames_per_clip: 16

# Multiple prompts per class; logits are averaged then softmaxed.
# Keep fight vs normal visually specific — avoid a shared "CCTV video of" prefix.
prompts:
  fight:
    - "a video of people punching and kicking each other"
    - "a video of a violent brawl, people hitting and shoving"
    - "a video of two people grappling and fighting on the ground"
  normal:
    - "a video of people walking or standing calmly"
    - "a video of pedestrians with no physical violence"
    - "a video of everyday activity without fighting"

clip:
  length_sec: 4.0
  stride_sec: 2.0
